# Action LoRA on Qwen3-VL-4B, AndroidControl train, 1 epoch. Keys are the ones in train.py DEFAULTS.
model: Qwen/Qwen3-VL-4B-Instruct   # Hugging Face id (downloaded on first use) or a local folder
image_max_pixels: 1302528          # 768x1696, about 1,270 image tokens per 1080x2400 screenshot

lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all                   # every Linear layer of the language model

per_device_train_batch_size: 8
gradient_accumulation_steps: 2     # 16 examples per update
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 100

output_dir: runs/lora_4b
